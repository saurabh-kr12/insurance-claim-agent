version: "3.9"

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs.db:/app/logs.db
    # Lets the container reach Ollama running on your host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
